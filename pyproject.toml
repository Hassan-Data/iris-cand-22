[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-pilot"
version = "0.1.0"
description = "IRIS-CAND-22: one-command pilot orchestration"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iris = "iris.cli:main"

[tool.setuptools]
packages = ["iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]